<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="ttl desc"><title id="ttl">One foundation, seven business contexts</title><desc id="desc">RISHEH connects strategy, design, engineering, data and intelligence to sectors including education, health, operations, AI, career technology, commerce and professional services.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#102E2B"/><stop offset="1" stop-color="#193C3F"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.pulse{animation:beat 4s ease-in-out infinite}.pulse2{animation:beat 4s ease-in-out -1.4s infinite}@keyframes beat{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="510" rx="20" fill="url(#g)"/><text x="56" y="60" fill="#A6CFC1" font-size="15" letter-spacing="3">INDUSTRY MAP / RISHEH</text><text x="56" y="119" fill="#F1F4E9" font-size="37" font-weight="700">One systems mindset.</text><text x="56" y="157" fill="#B6D8CA" font-size="23">Different business realities.</text><path d="M90 283H250 M250 283H425" stroke="#91C8B3" stroke-width="2" fill="none"/><circle cx="90" cy="283" r="39" fill="#CDEBD8"/><text x="90" y="291" font-size="21" font-weight="700" text-anchor="middle" fill="#123D33">R.</text><circle cx="250" cy="283" r="8" fill="#CDEBD8" class="pulse"/><rect x="420" y="206" width="210" height="156" rx="12" fill="#244B45" stroke="#7CB19E" stroke-opacity=".6"/><text x="525" y="245" text-anchor="middle" fill="#CDEBD8" font-size="14" letter-spacing="2">SHARED APPROACH</text><text x="525" y="277" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">Discover</text><text x="525" y="306" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">Design · Build</text><text x="525" y="335" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">Connect · Evolve</text><path d="M630 283H680 M680 90V437" fill="none" stroke="#90C2AC" stroke-width="1.5"/><g fill="none" stroke="#90C2AC" opacity=".65"><path d="M680 105H726M680 160H726M680 215H726M680 270H726M680 325H726M680 380H726M680 435H726"/></g><g fill="#CDEBD8" class="pulse2"><circle cx="680" cy="105" r="4"/><circle cx="680" cy="215" r="4"/><circle cx="680" cy="325" r="4"/><circle cx="680" cy="435" r="4"/></g><g font-size="20" fill="#F2F3EA"><text x="748" y="112">Education &amp; Schools</text><text x="748" y="167">Health &amp; Care Services</text><text x="748" y="222">Enterprise Operations</text><text x="748" y="277">AI Infrastructure</text><text x="748" y="332">Career Technology</text><text x="748" y="387">Digital Commerce</text><text x="748" y="442">Professional Services</text></g><text x="56" y="464" fill="#A6CFC1" font-size="14" letter-spacing="1">FROM BUSINESS FRICTION TO COHERENT DIGITAL SYSTEMS</text></svg>